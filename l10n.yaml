# Configuration de la génération des traductions (flutter gen-l10n).
# Les fichiers .arb de lib/l10n produisent la classe AppLocalizations, qui est
# régénérée automatiquement à chaque `flutter pub get` grâce à `generate: true`
# dans pubspec.yaml.
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
